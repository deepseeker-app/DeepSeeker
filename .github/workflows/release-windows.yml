name: Release Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $expected = "v$($desktop.version)"
          if ($env:RELEASE_TAG -cne $expected) {
            throw "Release tag $env:RELEASE_TAG does not match desktop version $expected"
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm run dist:win:desktop

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          $installer = 'apps/desktop/dist/DeepSeeker-windows-x64-setup.exe'
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "Missing NSIS installer: $installer"
          }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($installer))
          try {
            $dosMagic = $reader.ReadBytes(2)
            if ($dosMagic.Length -ne 2 -or $dosMagic[0] -ne 0x4d -or $dosMagic[1] -ne 0x5a) {
              throw 'Installer does not have a DOS MZ header'
            }
            if ($reader.BaseStream.Length -lt 64) {
              throw 'Installer is too small to contain a Windows PE header'
            }
            $reader.BaseStream.Position = 0x3c
            $peOffset = $reader.ReadUInt32()
            if ([long]$peOffset -gt $reader.BaseStream.Length - 4) {
              throw 'Installer has an invalid Windows PE header offset'
            }
            $reader.BaseStream.Position = [long]$peOffset
            $peMagic = $reader.ReadBytes(4)
            if (
              $peMagic.Length -ne 4 -or
              $peMagic[0] -ne 0x50 -or $peMagic[1] -ne 0x45 -or
              $peMagic[2] -ne 0x00 -or $peMagic[3] -ne 0x00
            ) {
              throw 'Installer does not have a Windows PE signature'
            }
          }
          finally {
            $reader.Dispose()
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DeepSeeker-windows-x64-setup.exe" |
            Set-Content 'apps/desktop/dist/DeepSeeker-windows-x64-setup.exe.sha256' -Encoding ascii

      - name: Smoke install, runtime, and uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'apps/desktop/dist/DeepSeeker-windows-x64-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'DeepSeeker-install-smoke'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent installer exited with $($install.ExitCode)"
          }
          $executable = Join-Path $installDir 'DeepSeeker.exe'
          $required = @(
            $executable,
            (Join-Path $installDir 'resources/app.asar'),
            (Join-Path $installDir 'resources/host/node_modules/@deepseek-ai/dsh/lib/bin.js'),
            (Join-Path $installDir 'resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Installed runtime is missing $path"
            }
          }
          $priorRunAsNode = $env:ELECTRON_RUN_AS_NODE
          try {
            $env:ELECTRON_RUN_AS_NODE = '1'
            $electronVersion = & $executable -e "process.stdout.write(process.versions.electron ?? '')"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($electronVersion)) {
              throw 'Installed Electron runtime did not start in Node mode'
            }
          }
          finally {
            $env:ELECTRON_RUN_AS_NODE = $priorRunAsNode
          }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -File | Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw 'Silent install did not create an uninstaller'
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstaller exited with $($uninstall.ExitCode)"
          }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $executable); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $executable) {
            throw 'Silent uninstall left the installed application executable behind'
          }

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeepSeeker-windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/DeepSeeker-windows-x64-setup.exe
            apps/desktop/dist/DeepSeeker-windows-x64-setup.exe.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download verified installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DeepSeeker-windows-x64
          path: apps/desktop/dist

      - name: Recheck installer checksum after artifact transfer
        working-directory: apps/desktop/dist
        run: sed 's/\r$//' DeepSeeker-windows-x64-setup.exe.sha256 | sha256sum --check -

      - name: Attach installer to draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            apps/desktop/dist/DeepSeeker-windows-x64-setup.exe
            apps/desktop/dist/DeepSeeker-windows-x64-setup.exe.sha256
