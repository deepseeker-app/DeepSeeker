name: DeepSeeker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseeker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows core
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject local patch residue
        run: |
          $trackedPaths = @(git ls-files)
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to list tracked paths'
          }
          $trackedResidue = @($trackedPaths | Select-String -Pattern '(^|/)\._|(^|/)dist/|^\.patch-work/')
          if ($trackedResidue.Count -gt 0) {
            $trackedResidue | ForEach-Object { Write-Error "Tracked residue: $($_.Line)" }
            exit 1
          }

          $patchFiles = @(Get-ChildItem -Path patches -Filter '@linxin666__*.patch' -File -ErrorAction Stop)
          $patchResidue = @($patchFiles | Select-String -Pattern '/(Volumes|Users|private|var/folders)/|\.pnpm_patches|^old mode |^new mode ')
          if ($patchResidue.Count -gt 0) {
            $patchResidue | ForEach-Object { Write-Error "Patch residue: $($_.Path):$($_.LineNumber):$($_.Line)" }
            exit 1
          }

      - name: Run static repository gates
        run: pnpm run check:ci:static

      - name: Lint
        run: pnpm run lint

      - name: Run full unit suite
        run: pnpm run test

      - name: Run GUI regressions
        run: pnpm run test:gui

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify Windows fixture portability
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/scaffold-portability.e2e.ts

      - name: Build product website
        run: pnpm --filter @deepseeker/site run build

  web-replay:
    name: Browser replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_SNAPSHOT: replay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Prepare bubblewrap sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build and run browser replay tests
        run: pnpm run test:web
