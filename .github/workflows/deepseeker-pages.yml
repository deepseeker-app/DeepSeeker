name: DeepSeeker Pages

on:
  # Publish only after the matching macOS and Windows Release assets exist, so
  # the website never advertises download links that still return 404.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Refuse a site with incomplete download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $desktop = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($desktop.version)"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($release.tag_name -cne $expectedTag) {
            throw "Latest release $($release.tag_name) does not match desktop version $expectedTag"
          }

          $required = @(
            'DeepSeeker-mac-arm64.zip',
            'DeepSeeker-mac-arm64.zip.sha256',
            'DeepSeeker-windows-x64-setup.exe',
            'DeepSeeker-windows-x64-setup.exe.sha256'
          )
          foreach ($name in $required) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1 -or $asset[0].size -le 0) {
              throw "Latest release is missing a valid $name asset"
            }
          }

          $pairs = @(
            @{ Package = 'DeepSeeker-mac-arm64.zip'; Checksum = 'DeepSeeker-mac-arm64.zip.sha256' },
            @{ Package = 'DeepSeeker-windows-x64-setup.exe'; Checksum = 'DeepSeeker-windows-x64-setup.exe.sha256' }
          )
          foreach ($pair in $pairs) {
            $packageAsset = @($release.assets | Where-Object { $_.name -ceq $pair.Package })[0]
            $checksumAsset = @($release.assets | Where-Object { $_.name -ceq $pair.Checksum })[0]
            if ($packageAsset.digest -notmatch '^sha256:[0-9a-f]{64}$') {
              throw "Latest release asset $($pair.Package) has no GitHub SHA-256 digest"
            }
            $checksumPath = Join-Path $env:RUNNER_TEMP $pair.Checksum
            Invoke-WebRequest -Uri $checksumAsset.browser_download_url -OutFile $checksumPath -UseBasicParsing
            $checksum = (Get-Content $checksumPath -Raw -Encoding ascii).Trim()
            Remove-Item $checksumPath -Force
            if ($checksum -notmatch '^([0-9a-f]{64})  ([^\r\n]+)$') {
              throw "Latest release checksum $($pair.Checksum) is malformed"
            }
            if ($Matches[2] -cne $pair.Package -or "sha256:$($Matches[1])" -ne $packageAsset.digest) {
              throw "Latest release checksum $($pair.Checksum) does not match $($pair.Package)"
            }
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deepseeker/site run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
